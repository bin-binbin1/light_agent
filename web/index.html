<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Agent</title>
    <link rel="stylesheet" href="/agent/static/style.css">
</head>
<body>
    <!-- 登录视图 -->
    <div id="loginView" class="login-view">
        <div class="login-card">
            <div class="login-icon">🤖</div>
            <h1>Light Agent</h1>
            <p class="login-hint">轻量化 AI 对话助手</p>
            <input type="text" id="usernameInput" placeholder="输入用户名进入"
                   onkeydown="if (event.key === 'Enter') login()">
            <button class="btn-login" onclick="login()">进入</button>
            <div id="loginError" class="login-error"></div>
        </div>
    </div>

    <!-- 聊天视图 -->
    <div id="chatView" class="chat-view hidden">
        <header class="main-header">
            <div class="title">
                <span>🤖 Light Agent</span>
            </div>
            <div class="user-info">
                <span class="username-tag" id="currentUser"></span>
                <button class="header-btn" onclick="resetSession()" title="重置对话">🔄 重置</button>
                <button class="header-btn" onclick="logout()" title="退出登录">↪ 退出</button>
            </div>
        </header>

        <div class="chat-container" id="chatContainer">
            <div class="welcome" id="welcomeHint">
                <h1>🤖 Light Agent</h1>
                <p class="hint">开始新的对话吧</p>
            </div>
        </div>

        <div class="input-area">
            <textarea id="messageInput" placeholder="输入消息 (Enter 发送, Shift+Enter 换行)"
                      rows="1" onkeydown="handleKeyDown(event)"></textarea>
            <button class="btn-send" onclick="sendMessage()" id="sendBtn">发送</button>
        </div>
    </div>

    <script src="/agent/static/app.js"></script>
</body>
</html>
