# Project-wide Gradle settings.
# https://docs.gradle.org/current/userguide/build_environment.html

# ------------------------- JVM & Concurrency -------------------------
# Larger heap + metaspace to avoid OOM on big projects; UTF-8 for source files.
org.gradle.jvmargs=-Xmx4096m -Xms1024m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8

# Parallel project builds (big win on multi-module; harmless on single-module).
org.gradle.parallel=true

# Configure on demand (skip projects not involved in the current build).
org.gradle.configureondemand=true

# Keep the Gradle Daemon resident (default true, declared here explicitly).
org.gradle.daemon=true

# ------------------------- Build Cache -------------------------
# Local build cache - reuse task outputs across builds.
org.gradle.caching=true

# Configuration cache - caches the result of the configuration phase.
# A handful of legacy plugins may not support it; AGP 8+/Kotlin 2.x/KSP all do.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# ------------------------- AndroidX -------------------------
android.useAndroidX=true
# No auto-migration for legacy support libraries (not needed on a new project).
android.enableJetifier=false

# Non-transitive R class - faster app module build (bigger win on multi-module).
android.nonTransitiveRClass=true

# ------------------------- Kotlin -------------------------
kotlin.code.style=official
# Incremental compile + parallel tasks.
kotlin.incremental=true
kotlin.parallel.tasks.in.project=true
